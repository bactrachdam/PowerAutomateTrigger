name: SharePoint File Created

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sharepoint-file-created]

env:
  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

jobs:
  send-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Send webhook
        run: |
          curl -X POST $WEBHOOK_URL \
            -H "Content-Type: application/json" \
            -d '{
              "event": "file-created",
              "fileName": "${{ github.event.client_payload.fileName }}",
              "fileNameWithExtension": "${{ github.event.client_payload.fileNameWithExtension }}",
              "fileUrl": "${{ github.event.client_payload.fileUrl }}",
              "fullPath": "${{ github.event.client_payload.fullPath }}",
              "driveId": "${{ github.event.client_payload.driveId }}",
              "driveItemId": "${{ github.event.client_payload.driveItemId }}",
              "siteUrl": "${{ github.event.client_payload.siteUrl }}",
              "createdBy": "${{ github.event.client_payload.createdBy }}",
              "eTag": "${{ github.event.client_payload.eTag }}",
              "modified": "${{ github.event.client_payload.modified }}"
            }'
